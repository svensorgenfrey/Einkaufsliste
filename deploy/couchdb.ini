[couchdb]
single_node = true
max_document_size = 2097152
[chttpd]
require_valid_user = true

[disk_monitor]
enable = true
interactive_database_writes_threshold = 85

[smoosh]
db_channels = upgrade_dbs,ratio_dbs,slack_dbs
view_channels = upgrade_views,ratio_views,slack_views
wait_secs = 30
staleness = 5

[smoosh.ratio_dbs]
priority = ratio
min_size = 1048576
min_priority = 2.0

[smoosh.slack_dbs]
priority = slack
min_size = 1048576
min_priority = 16777216

[smoosh.ratio_views]
priority = ratio
min_size = 1048576
min_priority = 2.0

[smoosh.slack_views]
priority = slack
min_size = 1048576
min_priority = 16777216
