services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couch-data:/opt/couchdb/data
      - ./deploy/couchdb.ini:/opt/couchdb/etc/local.d/shopping.ini:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS --user "$$COUCHDB_USER:$$COUCHDB_PASSWORD" http://127.0.0.1:5984/_up >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
  api:
    build: .
    restart: unless-stopped
    depends_on:
      couchdb: {condition: service_healthy}
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: '1'
    networks: [database, web]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    mem_limit: 128m
networks:
  database: {internal: true}
  web:
volumes:
  couch-data:
  caddy-data:
  caddy-config:
